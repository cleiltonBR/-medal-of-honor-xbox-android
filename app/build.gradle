plugins {
    id 'com.android.application'
}
android {
    namespace 'com.moha.europeanassault'
    compileSdk 35
    defaultConfig {
        applicationId 'com.moha.europeanassault'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }
    }
    externalNativeBuild {
        cmake {
            path '../CMakeLists.txt'
            version '3.22.1'
        }
    }
}
