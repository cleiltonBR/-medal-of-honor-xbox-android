name: Android ARM64 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Test Xbox XBE parser
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \\
            -I app/src/main/cpp/runtime \\
            app/src/main/cpp/runtime/xbe_loader.cpp \\
            tests/xbe_loader_test.cpp \\
            -o /tmp/xbe_loader_test
          /tmp/xbe_loader_test

      - name: Build ARM64 debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Medal-of-Honor-Android-ARM64
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
