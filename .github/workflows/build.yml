
name: Xbox Recomp - Linux Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-runtime:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout xboxrecomp
        uses: actions/checkout@v4
        with:
          repository: sp00nznet/xboxrecomp
          path: third_party/xboxrecomp

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libsdl2-dev libepoxy-dev libssl-dev \
            ffmpeg python3 python3-pip

      - name: Install Python dependency
        run: python3 -m pip install capstone

      - name: Configure runtime
        run: |
          cmake -S third_party/xboxrecomp \
            -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile runtime libraries
        run: cmake --build build --parallel 2
