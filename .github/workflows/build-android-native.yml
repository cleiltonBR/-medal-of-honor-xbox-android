
name: Build Medal of Honor Android Native

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - '.github/workflows/build-android-native.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.2.12479018"

      - name: Configure Android ARM64
        run: |
          cmake -S . -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile native library
        run: cmake --build build-android --parallel 2

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: moha-android-arm64
          path: build-android/libmoha_android.so
          if-no-files-found: error
          
